name: tests

# Runs the offline Pester test suite on Windows.
# The tests inject an in-memory fake registry backend and use a temp backup dir,
# so they NEVER read or modify the host's AppCompat registry settings.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Syntax check scripts
        shell: pwsh
        run: |
          $fail = $false
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 scripts | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $fail = $true; Write-Host "::error file=$($_.Name)::$($errors[0].Message)" }
          }
          if ($fail) { exit 1 }

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -SkipPublisherCheck -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error
          if ($r) { $r | Format-Table -AutoSize; throw "PSScriptAnalyzer found $($r.Count) error(s)" }
          Write-Host "PSScriptAnalyzer: no errors"

      - name: Run tests (offline, never touches host AppCompat)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
